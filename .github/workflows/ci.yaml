name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-OS smoke: tests + the matching jpackage profile so we catch
          # host-specific regressions in shade + jpackage early. Signing and
          # notarization are release-only; CI produces an unsigned DMG by
          # omitting `strange-eons.apple.signing.identity`. Linux installs
          # rpm + fakeroot so jpackage-linux can build .deb and .rpm in the
          # same package phase.
          - os: ubuntu-latest
            profile: jpackage-linux
            extra_setup: sudo apt-get update && sudo apt-get install -y rpm fakeroot xvfb
            mvn_prefix: xvfb-run -a
          - os: macos-15
            profile: jpackage-mac
            extra_setup: ""
            mvn_prefix: ""
          - os: macos-14
            profile: jpackage-mac
            extra_setup: ""
            mvn_prefix: ""
          - os: windows-latest
            profile: jpackage-win
            extra_setup: ""
            mvn_prefix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Extra setup for runner
        if: matrix.extra_setup != ''
        shell: bash
        run: ${{ matrix.extra_setup }}
      # Several Strange Eons classes touch AWT in their static initializers
      # (PlatformSupport, AbstractStrangeEonsEditor, etc.). Mockito's class
      # instrumentation triggers those <clinit>s, which throw HeadlessException
      # on a headless runner. Linux wraps the build in xvfb-run; macOS and
      # Windows runners have AWT available natively. Tracked by issue #4.
      - name: Run tests + smoke jpackage
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.mvn_prefix }} mvn -B -Pdeploy,${{ matrix.profile }} verify
      # macOS 14 made the legacy Carbon menu calls a hard trap (rdar://101002625):
      # a JDK built against the macOS 14 SDK SIGTRAPs at screen-menu-bar setup
      # when apple.laf.useScreenMenuBar=true, which Strange Eons always sets
      # (PlatformSupport / OSXHelper). See JDK-8319420. The jpackage smoke above
      # only builds the bundle; it never exercises the menu UI, so launch the
      # runtime that actually ships (inside the produced .app) against a minimal
      # screen-menu-bar reproducer. A bad runtime traps here and fails the job.
      - name: macOS screen-menu-bar launch smoke (JDK-8319420)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dmg=$(ls deployment/installers/*.dmg | head -1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app=$(ls -d "$mount"/*.app | head -1)
          java_bin="$app/Contents/runtime/Contents/Home/bin/java"
          if [[ ! -x "$java_bin" ]]; then
            echo "::error::bundled runtime not found at $java_bin"
            exit 1
          fi
          cat > "$RUNNER_TEMP/MenuSmoke.java" <<'EOF'
          import javax.swing.JFrame;
          import javax.swing.JMenu;
          import javax.swing.JMenuBar;
          import javax.swing.JMenuItem;
          import javax.swing.SwingUtilities;
          import javax.swing.UIManager;

          // Reproduces the screen-menu-bar path Strange Eons uses on macOS. A JDK
          // built against the macOS 14 SDK traps here with "References to Carbon
          // menus are disallowed with AppKit menu system"; a fixed JDK exits 0.
          public class MenuSmoke {
              public static void main(String[] args) throws Exception {
                  System.setProperty("apple.laf.useScreenMenuBar", "true");
                  UIManager.setLookAndFeel("com.apple.laf.AquaLookAndFeel");
                  SwingUtilities.invokeAndWait(() -> {
                      try {
                          JFrame f = new JFrame("smoke");
                          JMenuBar bar = new JMenuBar();
                          JMenu menu = new JMenu("File");
                          menu.add(new JMenuItem("Quit"));
                          bar.add(menu);
                          f.setJMenuBar(bar);
                          f.pack();
                          f.setVisible(true);
                      } catch (Throwable t) {
                          throw new RuntimeException(t);
                      }
                  });
                  Thread.sleep(1500);
                  System.exit(0);
              }
          }
          EOF
          echo "Running screen-menu-bar smoke with bundled runtime: $java_bin"
          "$java_bin" "$RUNNER_TEMP/MenuSmoke.java"
          echo "screen menu bar smoke passed (no Carbon trap)"
